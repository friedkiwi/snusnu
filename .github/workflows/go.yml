name: Go
on:
  push:
    paths: ['concentrator/**', 'sna/**', 'proto/**', 'sna_router/crates/snusnu-router/Cargo.toml', 'docs/protocol.md', 'docs/test-vectors/**', '.github/workflows/go.yml']
  pull_request:
    paths: ['concentrator/**', 'sna/**', 'proto/**', 'sna_router/crates/snusnu-router/Cargo.toml', 'docs/protocol.md', 'docs/test-vectors/**', '.github/workflows/go.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: concentrator
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: concentrator/go.mod
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Verify reusable SNA module
        working-directory: sna
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build ./...
