name: Protocol contract
on:
  push:
    paths: ['docs/protocol.md', 'docs/test-vectors/**', '.github/workflows/protocol.yml']
  pull_request:
    paths: ['docs/protocol.md', 'docs/test-vectors/**', '.github/workflows/protocol.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check protocol documentation
        run: |
          test -f docs/protocol.md
          test -d docs/test-vectors
          test -f docs/test-vectors/README.md
          grep -q '## Implemented invariants' docs/protocol.md
          grep -q '## Captured vectors' docs/test-vectors/README.md
