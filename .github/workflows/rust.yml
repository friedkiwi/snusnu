name: Rust
on:
  push:
    paths: ['sna_router/**', 'docs/protocol.md', 'docs/test-vectors/**', '.github/workflows/rust.yml']
  pull_request:
    paths: ['sna_router/**', 'docs/protocol.md', 'docs/test-vectors/**', '.github/workflows/rust.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sna_router
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sna_router/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sna_router/Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
