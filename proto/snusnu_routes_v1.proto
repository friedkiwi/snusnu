syntax = "proto3";

package snusnu.control.v1;

option go_package = "github.com/friedkiwi/snusnu/concentrator/internal/wire/routesv1;routesv1";

// Sent by a Rust router to the concentrator after authentication and whenever
// its exported reachability changes. The sender cannot supply its origin ID.
message RouteSnapshot {
  bytes epoch = 1;                 // Exactly 16 bytes; new on each connection.
  uint64 revision = 2;             // Starts at 1; increases within an epoch.
  repeated RouteExport routes = 3; // Complete replacement, including empty.
}

// Sent by the concentrator to authorized Rust peers. Origin is taken from the
// authenticated upstream connection, never from a publisher-controlled field.
message OriginRouteSnapshot {
  string origin = 1;
  RouteSnapshot snapshot = 2;
}

// Sent by the concentrator on disconnect, replacement, or policy withdrawal.
message OriginWithdraw {
  string origin = 1;
  bytes epoch = 2;
}

// A route ID is stable within the origin's config epoch. Generation changes
// whenever that ID is retargeted, so stale circuit opens cannot hit a new leg.
message RouteExport {
  uint64 id = 1;
  uint64 generation = 2;
  Handoff handoff = 3;

  oneof destination {
    LlcDestination llc = 4;
    Lu62Destination lu62 = 5;
  }
}

// Exact native 802.3/LLC destination; sap is the destination SAP (2..254,
// even). The origin keeps its local interface, proxy MAC and SAP private.
message LlcDestination {
  bytes mac = 1; // Exactly six bytes, unicast.
  uint32 sap = 2;
}

// A configured LU6.2 service, not an APPN topology announcement. Names are
// network-qualified and validated by the application against SNA name rules.
message Lu62Destination {
  string netid = 1;
  string lu = 2;
  repeated string modes = 3; // Exact supported modes; nonempty in v1.
}

// The event contract accepted by this origin when a remote circuit opens.
// Other handoff types can be added with new enum values and destinations.
enum Handoff {
  HANDOFF_UNSPECIFIED = 0;
  HANDOFF_NATIVE_LLC2_CIRCUIT = 1; // Type 1, connect and PIU events.
  HANDOFF_LU62_SESSION = 2;        // LU6.2 session events.
}

// Included in a circuit OPEN, which also carries its own circuit ID. The
// origin checks the reference against its current export and authorization.
message RouteReference {
  string origin = 1;
  bytes epoch = 2;
  uint64 route_id = 3;
  uint64 route_generation = 4;
  Handoff handoff = 5;
}
