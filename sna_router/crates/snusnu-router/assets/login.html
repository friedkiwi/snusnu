<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · snusnu router</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body class="login-body">
  <main class="login-card">
    <div class="login-brand"><span class="mark">S</span><span class="brand">snusnu router</span></div>
    <p class="eyebrow">Local router</p>
    <h1>Sign in</h1>
    <p>Enter the password configured on this router.</p>
    <form action="/login" method="post">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit" class="primary">Continue</button>
    </form>
    <p id="login-error" class="error" hidden>Incorrect password.</p>
  </main>
  <script src="/assets/login.js" defer></script>
</body>
</html>
